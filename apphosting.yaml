# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Route handlers are stateless (sessions are JWTs, connector work goes through the
  # Postgres outbox), so the app can scale out. Raise minInstances to 1 to avoid cold starts.
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Store secrets in Cloud Secret Manager:  firebase apphosting:secrets:set NAME
env:
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
  - variable: INTEGRATIONS_ENCRYPTION_KEY
    secret: INTEGRATIONS_ENCRYPTION_KEY
  - variable: CRON_SECRET
    secret: CRON_SECRET
  - variable: AUTH_TRUST_HOST
    value: "true"
  # Optional, uncomment what you use:
  # - variable: APP_URL               # public base URL, used in links and OAuth redirects
  #   value: https://deltapro.example.com
  # - variable: AUTH_ADMIN_EMAILS
  #   value: admin@yourcompany.com
  # - variable: AUTH_ALLOWED_DOMAINS
  #   value: yourcompany.com
  # - variable: AUTH_GOOGLE_ID
  #   secret: AUTH_GOOGLE_ID
  # - variable: AUTH_GOOGLE_SECRET
  #   secret: AUTH_GOOGLE_SECRET
  # - variable: AUTH_MICROSOFT_ENTRA_ID_ID
  #   secret: AUTH_MICROSOFT_ENTRA_ID_ID
  # - variable: AUTH_MICROSOFT_ENTRA_ID_SECRET
  #   secret: AUTH_MICROSOFT_ENTRA_ID_SECRET
  # - variable: AUTH_MICROSOFT_ENTRA_ID_ISSUER
  #   value: https://login.microsoftonline.com/<tenant-id>/v2.0
  # - variable: SLACK_CLIENT_ID
  #   secret: SLACK_CLIENT_ID
  # - variable: SLACK_CLIENT_SECRET
  #   secret: SLACK_CLIENT_SECRET
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
